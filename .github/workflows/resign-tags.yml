name: Re-sign tags

# Перевешивает теги с неподписанных коммитов на их копии, созданные через API: GitHub подписывает
# такой коммит сам, и тег в списке помечен Verified. Копия — то же дерево, те же родители и то же
# сообщение, так что архивы тега не меняются; master не трогается. Подписанные теги пропускаются,
# повторный запуск безопасен. Старый и новый sha каждого тега — в логе.
#
# Копию создаёт GITHUB_TOKEN, а перевесить тег он не может: в старых коммитах другие файлы
# workflow, а права Workflows у него нет. Для этого нужен секрет RESIGN_TOKEN — fine-grained
# токен на этот репозиторий с Contents и Workflows: Read and write. Без него workflow создаст
# копии и выведет команды git push, которые можно выполнить у себя.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Re-sign unverified tags
        env:
          GH_TOKEN: ${{ github.token }}
          RESIGN_TOKEN: ${{ secrets.RESIGN_TOKEN }}
        run: |
          API="repos/$GITHUB_REPOSITORY"
          MANUAL=""
          for TAG in $(git tag); do
            if [ "$(git cat-file -t "$TAG")" != commit ]; then
              echo "$TAG: аннотированный тег, пропускаю"
              continue
            fi
            SHA="$(git rev-parse "$TAG")"
            if [ "$(gh api "$API/commits/$SHA" --jq .commit.verification.verified)" = true ]; then
              continue
            fi
            echo "$TAG: создаю копию $SHA"
            NEW="$(gh api "$API/git/commits/$SHA" \
              --jq '{message, tree: .tree.sha, parents: [.parents[].sha]}' |
              gh api "$API/git/commits" --input - --jq .sha)"
            if [ "$(gh api "$API/git/commits/$NEW" --jq .verification.verified)" != true ]; then
              echo "$TAG: копия $NEW не подписана, тег не трогаю" >&2
              exit 1
            fi
            if [ -z "$RESIGN_TOKEN" ]; then
              MANUAL="$MANUAL"$'\n'"git fetch origin $NEW && git push --force origin $NEW:refs/tags/$TAG"
              echo "$TAG: копия $NEW готова, тег перевесить нечем (нет RESIGN_TOKEN)"
              continue
            fi
            echo "$TAG: перевешиваю на $NEW"
            GH_TOKEN="$RESIGN_TOKEN" gh api -X PATCH "$API/git/refs/tags/$TAG" \
              -f sha="$NEW" -F force=true >/dev/null
            echo "$TAG: $SHA -> $NEW"
          done
          if [ -n "$MANUAL" ]; then
            echo
            echo "Перевесить теги вручную (из клона репозитория):$MANUAL"
          fi
