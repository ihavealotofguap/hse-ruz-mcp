name: Publish

# Публикация по тегу vX.Y.Z: npm (trusted publishing, без токена) и реестр MCP (GitHub OIDC).
# Ручной запуск (workflow_dispatch) дотягивает реестр MCP, если версия уже есть в npm.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check versions
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "$(jq -r .version server.json)" = "$VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "${GITHUB_REF_NAME#v}" = "$VERSION"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "hse-ruz-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "hse-ruz-mcp@$VERSION уже в npm, пропускаю"
          else
            npm publish --provenance --access public
          fi

      # Реестр MCP проверяет версию в npm, а свежий релиз появляется там не сразу.
      - name: Wait for npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            npm view "hse-ruz-mcp@$VERSION" version --prefer-online >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "hse-ruz-mcp@$VERSION не появился в npm за 5 минут" >&2
          exit 1

      # Версия и sha256 закреплены: бинарник запускается в джобе с id-token: write. При обновлении
      # хеш брать из registry_<версия>_checksums.txt того же релиза.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.4
          MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
