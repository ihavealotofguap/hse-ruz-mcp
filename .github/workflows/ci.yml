name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Сервер должен считать даты по Москве при любой TZ хоста.
      - name: npm test (TZ=America/New_York)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node --test "test/*.test.mjs"
        env:
          TZ: America/New_York
