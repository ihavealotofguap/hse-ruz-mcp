name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # На Windows checkout переводит строки в CRLF, и проверка формата падала бы ложно.
      - run: npm run lint
        if: matrix.os == 'ubuntu-latest'
      - run: npm test
      # Сервер должен считать даты по Москве при любой TZ хоста.
      - name: npm test (TZ=America/New_York)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node --test "test/*.test.mjs"
        env:
          TZ: America/New_York
